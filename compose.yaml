name: anker-solix-dashboard

x-runtime: &runtime
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 128
  stop_grace_period: 45s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  api:
    <<: *runtime
    build:
      context: .
      target: api
    user: "0:0"
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env}
      INIT_ADMIN_USERNAME: ${INIT_ADMIN_USERNAME:-admin}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:-}
      INIT_ADMIN_PASSWORD_HASH: ${INIT_ADMIN_PASSWORD_HASH:-}
      DATA_DIR: /data
    volumes:
      - ${DATA_DIR:-./data}/db:/data
    networks: [backend]

  web:
    <<: *runtime
    build:
      context: .
      target: web
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      API_URL: http://api:8001
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env}
      API_TIMEOUT_SECONDS: ${API_TIMEOUT_SECONDS:-5}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      CANONICAL_ORIGIN: ${CANONICAL_ORIGIN:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      DASHBOARD_TIMEZONE: ${DASHBOARD_TIMEZONE:-Europe/Berlin}
      ANKER_SOURCE_TIMEZONE: ${ANKER_SOURCE_TIMEZONE:-}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-300}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT:-8501}:8000"
    networks: [web, backend]

  collector:
    <<: *runtime
    build:
      context: .
      target: collector
    user: "0:0"
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    environment:
      API_URL: http://api:8001
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env}
      API_TIMEOUT_SECONDS: ${API_TIMEOUT_SECONDS:-5}
      ANKER_USERNAME: ${ANKER_USERNAME:?Set ANKER_USERNAME in .env}
      ANKER_PASSWORD: ${ANKER_PASSWORD:?Set ANKER_PASSWORD in .env}
      ANKER_COUNTRY: ${ANKER_COUNTRY:-DE}
      ANKER_DEVICE_SN: ${ANKER_DEVICE_SN:-}
      ANKER_PAYLOAD_ENCRYPTION: ${ANKER_PAYLOAD_ENCRYPTION:-false}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-300}
      API_REQUEST_TIMEOUT_SECONDS: ${API_REQUEST_TIMEOUT_SECONDS:-90}
      MAX_RETRIES: ${MAX_RETRIES:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${DATA_DIR:-./data}/collector:/data
    depends_on:
      api:
        condition: service_healthy
    networks: [backend, collector-egress]
    stop_grace_period: 3m

  web-tests:
    profiles: [test]
    build:
      context: .
      target: web-tests
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=128m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  api-tests:
    profiles: [test]
    build:
      context: .
      target: api-tests
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=128m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  collector-tests:
    profiles: [test]
    build:
      context: .
      target: collector-tests
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=128m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

networks:
  web:
  backend:
    internal: true
  collector-egress:
