{% extends "public_base.html" %}
{% block title %}{{ error_title }} · Private Solardatenbank{% endblock %}
{% block main_class %}auth-main{% endblock %}
{% block content %}
  <section class="auth-card" aria-labelledby="error-title">
    <div class="auth-heading">
      <p class="eyebrow">FLUXO.IO</p>
      <h1 id="error-title">{{ error_title }}</h1>
      <p>{{ error_message }}</p>
    </div>
    <a class="secondary-button" href="/login">Zur Anmeldung</a>
  </section>
{% endblock %}
