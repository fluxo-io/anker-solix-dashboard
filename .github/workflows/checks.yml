name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r web/requirements.txt -r api/requirements.txt -r collector/requirements.txt -r web/requirements-dev.txt
      - run: scripts/check
      - run: docker build --target api --tag anker-solix-dashboard-api:check .
      - run: docker build --target web --tag anker-solix-dashboard-web:check .
      - run: docker build --target collector --tag anker-solix-dashboard-worker:check .
      - run: python -B scripts/docker_integration.py
        env:
          ANKER_TEST_API_IMAGE: anker-solix-dashboard-api:check
          ANKER_TEST_WEB_IMAGE: anker-solix-dashboard-web:check
          ANKER_TEST_COLLECTOR_IMAGE: anker-solix-dashboard-worker:check
